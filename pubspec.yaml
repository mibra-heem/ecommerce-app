name: ecommerce_app
description: "An ecommerce app"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  http: ^1.2.1
  shared_preferences: ^2.2.3
  flutter_dotenv: ^5.2.1
  location: ^6.0.2
  flutter_spinkit: ^5.2.1
  dots_indicator: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.6
  geolocator: ^12.0.0
  geocoding: ^4.0.0
  carousel_slider: ^5.1.1
  cached_network_image: ^3.4.0
  equatable: ^2.0.7
  dartz: ^0.10.1
  lottie: ^3.3.1
  get_it: ^8.0.3
  provider: ^6.1.5
  go_router: ^16.0.0
  iconly: ^1.0.1
  flutter_native_splash: ^2.4.6
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  font_awesome_flutter: ^10.8.0
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^7.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app-logo.png"

flutter:

  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/lotties/


  fonts:
    - family: RobotoMono 
      fonts:
        - asset: assets/fonts/RobotoMono/RobotoMono-VariableFont_wght.ttf
          weight: 200
        - asset: assets/fonts/RobotoMono/RobotoMono-Italic-VariableFont_wght.ttf
          weight: 200
          style: italic
    - family: Balsamiq Sans
      fonts:
        - asset: assets/fonts/Balsamiq_Sans/BalsamiqSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/Balsamiq_Sans/BalsamiqSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Balsamiq_Sans/BalsamiqSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/Balsamiq_Sans/BalsamiqSans-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Aeonik
      fonts:
        - asset: assets/fonts/aeonik/AeonikTRIAL-Light.otf
          weight: 300
        - asset: assets/fonts/aeonik/AeonikTRIAL-LightItalic.otf
          style: italic
          weight: 300
        - asset: assets/fonts/aeonik/AeonikTRIAL-Regular.otf
          weight: 400
        - asset: assets/fonts/aeonik/AeonikTRIAL-RegularItalic.otf
          style: italic
          weight: 400
        - asset: assets/fonts/aeonik/AeonikTRIAL-Bold.otf
          weight: 700
        - asset: assets/fonts/aeonik/AeonikTRIAL-BoldItalic.otf
          style: italic
          weight: 700
        
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/poppins/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
          weight: 800

